[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
repository = "https://github.com/Fokiiiiiii/closure-plugins"

[workspace.dependencies]
# closure itself. While developing next to a checkout of closure, `.cargo/config.toml` patches
# these to the local paths (see the README).
closure-core = { git = "https://github.com/Fokiiiiiii/closure" }
closure-sdk = { git = "https://github.com/Fokiiiiiii/closure" }
closure-i18n = { git = "https://github.com/Fokiiiiiii/closure" }

plugin-kit = { path = "crates/plugin-kit" }
plugin-linkexpand = { path = "crates/plugin-linkexpand" }
plugin-starboard = { path = "crates/plugin-starboard" }

anyhow = "1"
async-trait = "0.1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-platform-verifier"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder", "permission-calculator"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
assert_is_empty = "allow"
